# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: super clark
  pageTitleSuffix: ": the real punk rock"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: superclark.net
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Lexend
      body: Merriweather
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#fffdf9"
        lightgray: "#f2ede4"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#8b0000"
        tertiary: "#0d47a1"
        highlight: "#fff2aa"
        textHighlight: "#fff2aa"
      darkMode:
        light: "#1c1a17"
        lightgray: "#2c2822"
        gray: "#8a8a8a"
        darkgray: "#d4d4d4"
        dark: "#f2ede4"
        secondary: "#e05c5c"
        tertiary: "#5c9eff"
        highlight: "#6b5b1f"
        textHighlight: "#6b5b1f"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: left
      priority: 60
      condition: not-index
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: googleFonts
      header:
        name: Lexend
        weights:
          - 400
          - 600
          - 700
          - 800
        includeItalic: true
      body:
        name: Merriweather
        weights:
          - 300
          - 400
          - 700
          - 900
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights:
          - 400
          - 500
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: null
      priority: null
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: null
      priority: null
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: null
      priority: null
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: header
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 50
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        CC BY 4.0: https://creativecommons.org/licenses/by/4.0/
        the real punk rock: https://www.youtube.com/watch?v=Emu1pgPPCy8
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    layout:
      title: Recents
      position: null
      priority: null
      filter: (f) => ((f.slug ?? "").startsWith("music/") || (f.slug ?? "").startsWith("blog/")) && !(f.slug ??
        "").endsWith("index"),
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source:
      repo: https://github.com/clarkkristofor/quartz-components.git
      name: BookGridReadingNow
    enabled: true
    layout:
      position: afterBody
      priority: 25

  - source:
      repo: https://github.com/clarkkristofor/quartz-components.git
      name: BookGridRead
    enabled: true
    layout:
      position: afterBody
      priority: 25

  - source:
      repo: https://github.com/clarkkristofor/quartz-components.git
      name: NoteListMusicHome
    enabled: true
    layout: { position: afterBody, priority: 35 }

  - source:
      repo: https://github.com/clarkkristofor/quartz-components.git
      name: NoteListBlogHome
    enabled: true
    layout: { position: afterBody, priority: 45 }

  - source:
      repo: https://github.com/clarkkristofor/quartz-components.git
      name: NoteListMusicArchive
    enabled: true
    layout:
      position: afterBody
      priority: 25

  - source:
      repo: https://github.com/clarkkristofor/quartz-components.git
      name: NoteListBlogArchive
    enabled: true
    layout:
      position: afterBody
      priority: 25
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
