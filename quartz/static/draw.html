<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Oracle Deck</title>
<style>
  body { font-family: system-ui, sans-serif; background: #fffdf9; color: #2b2b2b; margin: 0; padding: 2rem 1rem; }
  #oracle-deck-widget { max-width: 500px; margin: 2rem auto; text-align: center; }
  #card-face { border: 1px solid #b8b8b8; border-radius: 12px; padding: 2rem; min-height: 200px; margin-bottom: 1.5rem; background: #fff; text-align: left; }
  #card-face h2 { margin-top: 1rem; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.7; }
  #card-face h2:first-child { margin-top: 0; }
  .oracle-card-title { margin-top: 0; font-size: 1.5rem; }
  #draw-btn { padding: 0.75rem 2rem; font-size: 1.1rem; cursor: pointer; border-radius: 8px; border: none; background: #8b0000; color: white; }
  #draw-btn:disabled { opacity: 0.5; cursor: default; }
  .oracle-hint { opacity: 0.6; font-style: italic; text-align: center; }
  .card-back { text-align: center; }
  .card-back h1 { margin-top: 0; font-size: 1.5rem; }
  .card-back img { max-width: 100%; height: auto; display: block; margin: 1rem auto; }
</style>
</head>
<body>

<div id="oracle-deck-widget">
  <div id="card-face"></div>
  <button id="draw-btn">Draw</button>
</div>

<script>
(function() {
  const WORKER_URL = "https://oracle-deck-worker.clark-kristofor.workers.dev";
  const POLL_MS = 3000;
  const TOTAL_CARDS = 10;

  const CARD_BACK_HTML = '<div class="card-back"><h1>Oracle Deck</h1><img src="/static/oracle-deck.svg" alt="Oracle Deck card back"></div>';

  const cardFace = document.getElementById("card-face");
  const drawBtn = document.getElementById("draw-btn");

  let lastKnownCurrent = undefined;
  let lastKnownUsedCount = 0;
  let polling = false;

  function showCardBack() {
    cardFace.innerHTML = CARD_BACK_HTML;
  }

  function fetchCard(slug, onReady) {
    fetch("/" + slug)
      .then(function(res) {
        if (!res.ok) throw new Error("Failed to load card");
        return res.text();
      })
      .then(function(html) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");
        const titleEl = doc.querySelector("h1.article-title");
        const articleBody = doc.querySelector("article.popover-hint .markdown-preview-view");
        if (!articleBody) throw new Error("Card content not found");
        onReady({
          title: titleEl ? titleEl.textContent : "",
          html: articleBody.innerHTML
        }, null);
      })
      .catch(function(err) {
        onReady(null, "Couldn't load that card. Try again.");
      });
  }

  function renderCurrentCard(slug) {
    fetchCard(slug, function(card, err) {
      if (err) {
        cardFace.innerHTML = '<p class="oracle-hint">' + err + '</p>';
        return;
      }
      cardFace.innerHTML = '<h1 class="oracle-card-title">' + card.title + '</h1>' + card.html;
    });
  }

  function updateButtonLabel(usedCount) {
    drawBtn.textContent = usedCount >= TOTAL_CARDS ? "Reshuffle" : "Draw";
  }

  function applyState(state) {
    const usedCount = state.used ? state.used.length : 0;
    updateButtonLabel(usedCount);

    const currentChanged = state.current !== lastKnownCurrent;
    if (currentChanged) {
      lastKnownCurrent = state.current;
      if (state.current) {
        renderCurrentCard(state.current);
      } else {
        showCardBack();
      }
    }
    lastKnownUsedCount = usedCount;
  }

  function fetchState() {
    fetch(WORKER_URL + "/state")
      .then(function(res) { return res.json(); })
      .then(applyState)
      .catch(function() { /* silent; retries on next poll */ });
  }

  function startPolling() {
    if (polling) return;
    polling = true;
    setInterval(fetchState, POLL_MS);
  }

  function handleDrawClick() {
    drawBtn.disabled = true;
    const endpoint = lastKnownUsedCount >= TOTAL_CARDS ? "/reshuffle" : "/draw";
    fetch(WORKER_URL + endpoint, { method: "POST" })
      .then(function(res) { return res.json(); })
      .then(function(state) {
        drawBtn.disabled = false;
        applyState(state);
      })
      .catch(function() {
        drawBtn.disabled = false;
      });
  }

  drawBtn.addEventListener("click", handleDrawClick);
  showCardBack();
  fetchState();
  startPolling();
})();
</script>

</body>
</html>
